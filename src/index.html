    <script>
      (function() {
        // 1. Suprimir excepciones no controladas de telemetría / web-vitals externos (startTime / reportAllChanges)
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && event.error.message))) || '';
            if (typeof msg === 'string' && (
              msg.indexOf('startTime') !== -1 ||
              msg.indexOf('reportAllChanges') !== -1
            )) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = (event && event.reason && (event.reason.message || event.reason)) || '';
            if (typeof reason === 'string' && (
              reason.indexOf('startTime') !== -1 ||
              reason.indexOf('reportAllChanges') !== -1
            )) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
            }
          }, true);

          // 2. Proteger PerformanceObserver para asegurar que entries siempre tengan startTime
          if (window.PerformanceObserver) {
            try {
              var OrigPerfObserver = window.PerformanceObserver;
              var SafePerfObserver = function(callback) {
                var safeCallback = function(list, observer) {
                  try {
                    if (list && typeof list.getEntries === 'function') {
                      var origGetEntries = list.getEntries.bind(list);
                      list.getEntries = function() {
                        try {
                          var entries = origGetEntries();
                          if (Array.isArray(entries)) {
                            return entries.map(function(item) {
                              if (item && typeof item.startTime === 'undefined') {
                                try { item.startTime = performance.now(); } catch(e) {}
                              }
                              return item;
                            }).filter(Boolean);
                          }
                          return entries || [];
                        } catch(e) {
                          return [];
                        }
                      };
                    }
                    return callback.call(this, list, observer);
                  } catch (err) {
                    var errMsg = (err && err.message) || '';
                    if (errMsg.indexOf('startTime') !== -1 || errMsg.indexOf('reportAllChanges') !== -1) {
                      return;
                    }
                  }
                };
                return new OrigPerfObserver(safeCallback);
              };
              SafePerfObserver.prototype = OrigPerfObserver.prototype;
              SafePerfObserver.supportedEntryTypes = OrigPerfObserver.supportedEntryTypes;
              window.PerformanceObserver = SafePerfObserver;
            } catch(e) {}
          }
        }

        try {
          var origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;

          function defineFetchAccessor(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          }

          if (typeof window !== 'undefined') {
            defineFetchAccessor(window);
            if (window.Window && window.Window.prototype) {
              defineFetchAccessor(window.Window.prototype);
            }
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            defineFetchAccessor(globalThis);
          }
        } catch(e) {}
      })();
    </script>
