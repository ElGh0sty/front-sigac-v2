<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Registro de Bitácora</h2>
    <p class="text-slate-500 text-sm mt-1">Registra las actividades realizadas durante tu ayudantía.</p>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <!-- Success Alert -->
    <div *ngIf="successMessage" class="mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl flex items-center gap-2.5">
      <i class="fa-solid fa-circle-check text-emerald-500"></i>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2.5">
      <i class="fa-solid fa-circle-exclamation text-red-500"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="registrarBitacora()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Ayudantía</label>
        <select [(ngModel)]="registro.ayudantiaId" name="ayudantiaId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="0">Selecciona una ayudantía...</option>
          <option *ngFor="let a of ayudantias" [value]="a.id">{{ a.nombre }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Actividades Realizadas</label>
        <textarea rows="4" [(ngModel)]="registro.actividadesRealizadas" name="actividadesRealizadas" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" placeholder="Describe detalladamente las actividades realizadas..."></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Enlace a Evidencia</label>
        <input type="url" [(ngModel)]="registro.evidenciaUrl" name="evidenciaUrl" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900" placeholder="https://drive.google.com/..." />
      </div>

      <button type="submit" [disabled]="isLoading" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 transition-all transform hover:-translate-y-0.5 disabled:opacity-50">
        {{ isLoading ? 'Registrando...' : 'Registrar Bitácora' }}
      </button>
    </form>
  </section>
</div>
