<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Gestión de Ayudantías</h2>
    <p class="text-slate-500 text-sm mt-1">Administra las solicitudes, asignaciones y seguimiento de ayudantías.</p>
  </div>

  <div class="glass-card rounded-2xl overflow-hidden">
    <!-- Pestañas -->
    <div class="flex border-b border-slate-200 bg-slate-50/50">
      <button (click)="tab = 'solicitudes'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'solicitudes' ? 'border-accent text-accent' : 'border-transparent text-slate-500'">
        Solicitudes
      </button>
      <button (click)="tab = 'asignaciones'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'asignaciones' ? 'border-accent text-accent' : 'border-transparent text-slate-500'">
        Asignaciones
      </button>
      <button (click)="tab = 'seguimiento'" class="flex-1 py-3 text-sm font-medium transition-colors border-b-2" [ngClass]="tab === 'seguimiento' ? 'border-accent text-accent' : 'border-transparent text-slate-500'">
        Seguimiento
      </button>
    </div>

    <div class="p-6">
      <!-- Solicitudes -->
      <div *ngIf="tab === 'solicitudes'">
        <app-solicitudes></app-solicitudes>
      </div>
      <!-- Asignaciones -->
      <div *ngIf="tab === 'asignaciones'">
        <app-asignaciones></app-asignaciones>
      </div>
      <!-- Seguimiento -->
      <div *ngIf="tab === 'seguimiento'">
        <app-seguimiento></app-seguimiento>
      </div>
    </div>
  </div>
</div>
