<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Asignación de Ayudantes</h2>
    <p class="text-slate-500 text-sm mt-1">Asigna estudiantes aprobados a una cátedra.</p>
  </div>

  <!-- Success Alert -->
  <div *ngIf="successMessage" class="p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl flex items-center gap-2.5 max-w-2xl">
    <i class="fa-solid fa-circle-check text-emerald-500"></i>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Error Alert -->
  <div *ngIf="errorMessage" class="p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2.5 max-w-2xl">
    <i class="fa-solid fa-circle-exclamation text-red-500"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <section class="glass-card rounded-2xl p-6 max-w-2xl">
    <form (ngSubmit)="asignar()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Seleccionar Postulación / Ayudantía</label>
        <select [(ngModel)]="asignacion.ayudantiaId" name="ayudantiaId" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none text-slate-900">
          <option [value]="0">Selecciona una postulación...</option>
          <option *ngFor="let s of solicitudesPendientes" [value]="s.ayudantiaId">
            #{{ s.ayudantiaId }} - {{ s.nombreEstudiante }} ({{ s.nombreCatedra }})
          </option>
        </select>
      </div>
      <button type="submit" [disabled]="isLoading" class="py-3 px-6 bg-accent hover:bg-accent-dim text-white font-bold rounded-xl shadow-lg shadow-accent/20 disabled:opacity-50">
        {{ isLoading ? 'Asignando...' : 'Asignar Ayudante' }}
      </button>
    </form>
  </section>
</div>
