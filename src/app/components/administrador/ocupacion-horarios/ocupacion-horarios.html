<div class="space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-900">Ocupación de Horarios</h2>
    <p class="text-slate-500 text-sm mt-1">Selecciona una clase y marca los horarios ocupados por la institución.</p>
  </div>

  <div class="glass-card rounded-2xl p-6 border border-slate-200">
    <!-- Selector de clase -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-slate-700 mb-1">Selecciona una Clase</label>
      <select [(ngModel)]="claseSeleccionadaId" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white">
        <option [value]="0">Selecciona una clase...</option>
        <option *ngFor="let c of clases" [value]="c.id">{{ c.nombre }}</option>
      </select>
    </div>

    <!-- Cuadrícula de horarios -->
    <div *ngIf="claseSeleccionadaId > 0" class="overflow-x-auto">
      <div class="grid" [style.gridTemplateColumns]="'80px repeat(' + dias.length + ', 1fr)'">
        <div class="font-semibold text-slate-600 text-sm py-2 text-center border-b border-slate-200">Hora</div>
        <div *ngFor="let d of dias" class="font-semibold text-slate-600 text-sm py-2 text-center border-b border-slate-200 border-l border-slate-200">{{ d }}</div>

        <ng-container *ngFor="let h of horas">
          <div class="py-2 text-xs text-slate-500 text-center border-b border-slate-200">{{ h }}</div>
          <div *ngFor="let d of dias" (click)="toggleOcupado(d, h)" class="py-2 text-center border-b border-slate-200 border-l border-slate-200 cursor-pointer transition-colors" [ngClass]="isOcupado(d, h) ? 'bg-red-200 text-red-700' : 'hover:bg-slate-100'">
            <span *ngIf="isOcupado(d, h)" class="text-xs font-bold">Ocupado</span>
            <span *ngIf="!isOcupado(d, h)" class="text-xs text-slate-400">Disponible</span>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
