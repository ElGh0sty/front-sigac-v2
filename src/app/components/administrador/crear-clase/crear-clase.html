<div class="space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Crear Nueva Clase / Paralelo</h2>
      <p class="text-slate-500 text-sm mt-1">Registra un paralelo o clase y asócialo a su materia oficial y docente asignado.</p>
    </div>
    <a (click)="goBack($event)" routerLink="/clases" class="cursor-pointer py-2 px-4 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition-colors text-sm font-medium flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left text-xs"></i> Volver a Clases
    </a>
  </div>

  <section class="glass-card rounded-2xl p-6 md:p-8 border border-slate-200 max-w-3xl">
    <!-- Success Alert -->
    <div *ngIf="successMessage" class="mb-5 p-3.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl flex items-center gap-2.5 shadow-sm">
      <i class="fa-solid fa-circle-check text-emerald-500 text-base"></i>
      <span class="font-medium">{{ successMessage }}</span>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="mb-5 p-3.5 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl flex items-center gap-2.5 shadow-sm">
      <i class="fa-solid fa-circle-exclamation text-red-500 text-base"></i>
      <span class="font-medium">{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="guardarClase()" class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Nombre del Paralelo / Clase -->
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre del Paralelo / Clase *</label>
          <input
            type="text"
            [(ngModel)]="nuevaClase.nombre"
            name="nombre"
            required
            placeholder="Ej: Paralelo A o 3ro Software A"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
          />
        </div>

        <!-- Materia Asignada (Desplegable oficial) -->
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Materia Asignada *</label>
          <select
            [(ngModel)]="nuevaClase.materiaId"
            name="materiaId"
            required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
          >
            <option [value]="0" disabled>Selecciona una materia...</option>
            <option *ngFor="let m of materias" [value]="m.id">
              {{ m.nombre }} ({{ m.codigo }}) - Semestre: {{ m.semestre || '2026-2' }}
            </option>
          </select>
          <p class="text-xs text-slate-500 mt-1">Selecciona la materia oficial a la cual pertenece este paralelo.</p>
        </div>

        <!-- Programa / Carrera -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Programa / Carrera</label>
          <input
            type="text"
            [(ngModel)]="nuevaClase.carrera"
            name="carrera"
            placeholder="Ej: Ingeniería de Software"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
          />
        </div>

        <!-- Semestre -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Semestre Académico *</label>
          <input
            type="text"
            [(ngModel)]="nuevaClase.semestre"
            name="semestre"
            required
            placeholder="Ej: 2026-2"
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
          />
        </div>

        <!-- Docente Tutor / Coordinador -->
        <div class="md:col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-1">Docente Asignado *</label>
          <select
            [(ngModel)]="nuevaClase.docenteId"
            name="docenteId"
            required
            class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
          >
            <option [value]="0" disabled>Selecciona un docente...</option>
            <option *ngFor="let d of docentes" [value]="d.id">
              {{ d.nombre }} {{ d.correo ? '(' + d.correo + ')' : '' }} [ID: {{ d.id }}]
            </option>
          </select>
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Descripción / Observaciones</label>
        <textarea
          [(ngModel)]="nuevaClase.descripcion"
          name="descripcion"
          rows="2"
          placeholder="Horario diurno, aula asignada, requisitos específicos..."
          class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent/20 focus:border-accent outline-none bg-white text-sm"
        ></textarea>
      </div>

      <div class="pt-2 flex items-center justify-end gap-3 border-t border-slate-100">
        <a (click)="goBack($event)" routerLink="/clases" class="cursor-pointer py-2.5 px-5 text-slate-600 hover:text-slate-900 text-sm font-semibold">
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="isLoading"
          class="py-2.5 px-7 bg-accent hover:bg-accent-dim text-white font-semibold rounded-xl transition-colors shadow-sm shadow-accent/20 disabled:opacity-50 flex items-center gap-2 text-sm"
        >
          <i *ngIf="isLoading" class="fa-solid fa-spinner animate-spin"></i>
          <span>{{ isLoading ? 'Guardando...' : 'Crear y Registrar Clase' }}</span>
        </button>
      </div>
    </form>
  </section>
</div>
