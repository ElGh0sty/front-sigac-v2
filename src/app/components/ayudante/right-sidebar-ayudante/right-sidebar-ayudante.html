<aside class="w-full bg-white flex flex-col shrink-0 z-20 relative border-l border-slate-200">
  <div class="h-[72px] flex items-center justify-between px-6 shrink-0 border-b border-slate-200">
    <h2 class="text-sm font-semibold text-slate-900">Mis Clases Asignadas</h2>
    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-teal-50 text-teal-700 border border-teal-200 uppercase">Ayudantía</span>
  </div>
  <div class="flex-1 overflow-y-auto p-5 space-y-6">
    <div class="space-y-3">
      <div *ngFor="let clase of proximasClases" class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:border-teal-300 transition-colors">
        <div class="flex items-center justify-between gap-1 mb-1">
          <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-teal-100 text-teal-800 border border-teal-200 uppercase">
            {{ clase.estado }}
          </span>
          <span class="text-[10px] text-slate-400 font-medium">{{ clase.curso }}</span>
        </div>
        <p class="text-sm font-semibold text-slate-900 mt-1">{{ clase.titulo }}</p>
        <p class="text-[11px] text-slate-500 mt-0.5">{{ clase.descripcion }}</p>
        <div class="flex items-center gap-2 mt-2 text-xs text-teal-700 font-medium">
          <i class="fa-regular fa-clock"></i> {{ clase.horario }}
        </div>
      </div>
      
      <a routerLink="/ayudante/horarios" class="text-xs font-semibold text-teal-700 hover:text-teal-900 flex items-center justify-center gap-1.5 pt-2 hover:underline">
        <i class="fa-solid fa-calendar-days text-xs"></i>
        <span>Ver mi horario completo de clases →</span>
      </a>
    </div>
  </div>
</aside>
